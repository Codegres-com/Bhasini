name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/Bhasini.Core.Tests -c Release

      - name: Publish
        run: dotnet publish src/Bhasini.Web/Bhasini.Web.csproj -c Release -o publish

      - name: Prepare site
        run: |
          cd publish/wwwroot
          # Custom domain (DNS on Cloudflare points here)
          echo "bhasini.com" > CNAME
          # Serve _framework and other underscore folders as-is
          touch .nojekyll
          # Deep links fall back to the Blazor router
          cp index.html 404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
