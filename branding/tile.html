<!DOCTYPE html>
<!-- Source for the wide Store tile and splash screen (BhasiniWindows/make-assets.py). Scales with the window. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Noto+Sans+Devanagari:wght@700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body {
    background: linear-gradient(115deg, #1f2a5c 0%, #2d3a8c 65%, #3b2f7a 100%);
    display: flex; align-items: center; justify-content: center; gap: 5vw;
    color: #fff; font-family: 'Poppins', 'Segoe UI', sans-serif;
  }
  .mark {
    width: 30vh; height: 30vh; border-radius: 7vh;
    background: linear-gradient(135deg, #ff9a3c, #e2531f);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Sans Devanagari', 'Nirmala UI', sans-serif; font-weight: 700; font-size: 16vh;
  }
  .name { font-size: 15vh; font-weight: 700; line-height: 1; }
  .name span { display: block; font-family: 'Noto Sans Devanagari', 'Nirmala UI', sans-serif; color: #ffc58f; font-size: 9vh; margin-top: 2vh; }
</style>
</head>
<body>
  <div class="mark">भा</div>
  <div class="name">Bhasini<span>भाषिणी</span></div>
</body>
</html>
